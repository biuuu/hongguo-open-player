name: Build & Release Native Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_bump:
        description: '仅限 main 分支。版本升级方式 (auto: 自动语义化/无变化则末位+1; patch / minor / major: 强制指定)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: build-release
  # Keep pending tag and manual releases instead of replacing them on new pushes.
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prep:
    name: Prepare Release Version
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      raw_version: ${{ steps.version.outputs.raw_version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Compute version
        id: version
        env:
          INPUT_FORCE_BUMP: ${{ inputs.force_bump || 'auto' }}
        run: |
          node scripts/compute-release-version.js

  build-bytevc2:
    name: Build ByteVC2 decoder (${{ matrix.arch }})
    needs: prep
    if: ${{ needs.prep.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win-x64
            output: x64
    steps:
      - uses: actions/checkout@v7

      - name: Restore ByteVC2 decoder cache
        id: cache-bytevc2
        uses: actions/cache@v6
        with:
          path: build/bytevc2/${{ matrix.output }}
          key: bytevc2-${{ matrix.arch }}-${{ hashFiles('scripts/build-bytevc2.sh', 'vendor/bytevc2/**') }}

      - if: runner.os == 'Windows' && steps.cache-bytevc2.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            make patch curl tar gzip diffutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf
      - name: Build decoder (Windows)
        if: runner.os == 'Windows' && steps.cache-bytevc2.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-bytevc2.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bytevc2-${{ matrix.arch }}
          path: build/bytevc2/${{ matrix.output }}/
          if-no-files-found: error

  build:
    name: Build Native Apps (windows)
    needs: [prep, build-bytevc2]
    if: ${{ needs.prep.outputs.should_release == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Cache Electron and electron-builder
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm ci

      - name: Download Windows decoder
        uses: actions/download-artifact@v8
        with:
          name: bytevc2-win-x64
          path: build/bytevc2/x64

      - name: Sync package version
        shell: bash
        run: |
          npm version "${{ needs.prep.outputs.raw_version }}" --no-git-tag-version --allow-same-version

      - name: Run offline regression tests
        run: npm run test:unit

      - name: Build Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-windows
          path: |
            dist-electron/*-win-x64*.exe
            dist-electron/*-win-x64*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create or Update GitHub Release
    needs: [prep, build]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.prep.outputs.should_release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-windows
          path: release-assets

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "红果开源播放器 Windows 原生桌面版 ${{ needs.prep.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎬 红果开源播放器 Windows 原生桌面版 ${{ needs.prep.outputs.tag }}

            Windows 原生桌面应用，开箱即用，无需打开任何网页浏览器。

            #### ✨ 核心特性：
            - 🖥️ **Windows 原生桌面应用**：支持 Windows (x64)；
            - 🍿 **全集免费秒播**：免手机登录，突破网页试看限制，整部 80~100+ 集无缝畅播；
            - ⚡ **MP4 CENC 实时流式解密**：原生级内存实时解密与 8 路并发 Range 下载加速，极速起播；
            - 🎬 **沉浸式竖屏影院**：专为短剧定制的 9:16 沉浸比例，键盘 ↑/↓ 秒切集数，空格暂停，左右快进；
            - 💾 **观影进度记忆**：自动记录各剧集播放进度，支持剧目收藏与分类检索。

            #### 📥 下载安装方式：
            - **Windows (x64)**：
              - 安装向导版：下载 `hongguo-open-player-*-win-x64-setup.exe`，双击根据向导安装，自动创建桌面与开始菜单快捷方式。
              - 单文件便携版：下载 `hongguo-open-player-*-win-x64-portable.exe`，双击直接运行。
              - 绿色免安装 ZIP：下载 `hongguo-open-player-*-win-x64.zip`，解压后双击 `红果开源播放器.exe` 直接运行。
          files: |
            release-assets/*
